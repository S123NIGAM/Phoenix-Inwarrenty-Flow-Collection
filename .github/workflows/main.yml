name : Postman Collection Workflow

on:
  push:
    branches: [main]
  workflow_dispatch :
  schedule :
   - cron : 30 02 * * * #8:00 AM IST Every Day
   - cron : 00 14 * * * #7:30 PM IST Every Day
   - cron : 00 06 * * 1-5 # 11:30 AM IST Monday to Friday
jobs:
  run-postman-tests:
    runs-on: ubuntu-latest

    steps :
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        
      - name: Setup Node.js environment(Install node js and npm)
        uses: actions/setup-node@v7.0.0
        with:
          node version: '22'

      - name: Install newman and html-extra libraries
        run: | 
            npm install -g newman
            npm install -g newman-reporter-htmlextra

      - name: run the postman collection with newman
        run: |
             newman run "Newman - Inwarranty-flow Collection(Jatin's collection).postman_collection.json" \
             -e QA.postman_environment.json \
             -d testdata.csv \
             -r cli,htmlextra

      - name: Archieve the reports(search upload artifacts)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with: 
          name: Newman Report
          path: newman/*.html

      

      
      







    
